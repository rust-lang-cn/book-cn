name: Build and Release EPUB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: false
        default: 'nightly'

jobs:
  build-epub:
    name: Build and Release EPUB
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true

    - name: Setup Rust
      run: |
        rustup set profile minimal
        rustup toolchain install stable
        rustup default stable

    - name: Install mdbook and mdbook-epub
      run: |
        cargo install mdbook --locked
        cargo install mdbook-epub --locked

    - name: Build book (HTML + EPUB)
      run: |
        mdbook build
        # EPUB 会生成在 book/epub/ 目录
        ls -la book/epub/

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        cp book/epub/*.epub artifacts/ 2>/dev/null || echo "No EPUB found"

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF_NAME}"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Rust 程序设计语言 中文版 - ${{ steps.version.outputs.version }}"
        tag_name: ${{ steps.version.outputs.version }}
        body: |
          ## Rust 程序设计语言（中文版）EPUB 电子书
          
          使用 mdbook-epub 自动构建的 EPUB 格式电子书。
          
          ### 构建信息
          - 版本：${{ steps.version.outputs.version }}
          - 提交：${{ github.sha }}
          
          ### 阅读方式
          下载 EPUB 文件后，可在以下设备阅读：
          - Apple Books (iOS/macOS)
          - Google Play Books (Android)
          - Calibre (跨平台)
          - 各类电子书阅读器
        files: |
          artifacts/*.epub
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, 'nightly') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
